# Continuous integration: tests (leakage, track record) and a headless smoke test of every dashboard page.
name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            app/requirements.txt
      - name: Install light dependencies
        run: |
          pip install -r app/requirements.txt
          pip install holidays python-dotenv requests pytest
      - name: Unit tests (no-leakage, fuels, live track record, battery, data checks)
        run: python -m pytest tests -q
      - name: Dashboard smoke test (every page runs against the committed reports/)
        run: python -m pytest tests/test_dashboard_smoke.py -q
