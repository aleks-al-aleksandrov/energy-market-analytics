# Daily next-day forecast (stretch tier).
# Needs the repository secret ENTSOE_API_KEY (and optionally OILPRICE_API_KEY). Raw data and trained models are kept in
# the Actions cache, so only the latest month is re-downloaded on each run.
name: next-day-forecast

on:
  schedule:
    - cron: "0 8 * * *"     # 08:00 UTC = before the 12:00 CET day-ahead gate closure
    - cron: "0 3 * * 1"     # Mondays: full retrain (expanding window)
  workflow_dispatch:
    inputs:
      retrain:
        description: "Retrain all models first"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 360          # a cold start (download + full retrain) needs hours on a hosted runner; later runs take minutes
    env:
      ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
      OILPRICE_API_KEY: ${{ secrets.OILPRICE_API_KEY }}   # optional: daily TTF history keeps growing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
      # Two separate caches, each saved right after its stage, so a timeout in the long retrain never loses the download.
      - name: Restore raw data
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: ema-data-${{ github.run_id }}
          restore-keys: ema-data-
      - name: Restore models
        uses: actions/cache/restore@v4
        with:
          path: models
          key: ema-models-${{ github.run_id }}
          restore-keys: ema-models-
      - name: Download data (monthly Parquet cache; only new months are fetched)
        run: python -m src.run_all --ingest-only
      - name: Save raw data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: ema-data-${{ github.run_id }}
      - name: Retrain (weekly, on demand, or when no model exists)
        id: retrain
        if: github.event.schedule == '0 3 * * 1' || inputs.retrain || hashFiles('models/final_models.joblib') == ''
        run: python -m src.run_all --skip-ingest --plus
      - name: Save models cache
        if: steps.retrain.conclusion == 'success'
        uses: actions/cache/save@v4
        with:
          path: models
          key: ema-models-${{ github.run_id }}
      - name: Forecast next delivery day
        run: python -m src.predict_next_day
      - name: Monte Carlo revenue range for the new forecast
        run: python -m src.montecarlo
      - name: Re-check whether outage history is testable (weekly)
        if: github.event.schedule == '0 3 * * 1' || github.event_name == 'workflow_dispatch'
        run: python -m src.retest_optional
      - name: Publish forecast
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f reports/forecast_next_day.csv reports/ttf_snapshots.csv reports/forecast_log.csv reports/live_track_record.csv reports/outage_pit.csv reports/mc_summary.json reports/retest_status.json
          # After a retrain the dashboard's other inputs changed too (metrics, SHAP, battery study ...): publish all of reports/,
          # so a hosted copy that reads the repository shows current numbers. Weekly only, to keep the repository small.
          if [ "${{ github.event.schedule }}" = "0 3 * * 1" ] || [ "${{ inputs.retrain }}" = "true" ]; then git add -f reports; fi
          git commit -m "Next-day forecast $(date -u +%Y-%m-%d)" || echo "no change"
          git push
